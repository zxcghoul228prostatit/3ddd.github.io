<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Фотогалерея</title>
    <style>
        /* 1. Базовые настройки стиля */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
            /* Это нужно, чтобы подвал всегда был снизу */
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 2. Верхняя шапка (Header) - название сайта */
        header {
            background-color: #fff;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            color: #2c3e50;
        }

        header p {
            color: #7f8c8d;
        }

        /* 3. Галерея фотографий */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            flex: 1; /* Растягивает блок, толкая подвал вниз */
        }

        .gallery {
            display: grid;
            /* Автоматическая сетка: фото подстраиваются под экран */
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .photo-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .photo-card:hover {
            transform: translateY(-5px); /* Эффект парения при наведении */
        }

        .photo-card img {
            width: 100%;
            height: 250px;
            object-fit: cover; /* Чтобы фото не сплющивались */
            display: block;
        }

        .photo-desc {
            padding: 15px;
            text-align: center;
        }

        /* 4. Нижняя шапка (Footer) */
        footer {
            background-color: #2c3e50; /* Темно-синий цвет */
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: auto; /* Прижимает футер к низу */
        }

        footer a {
            color: #3498db;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- Верхняя часть -->
    <header>
        <h1>Моё Портфолио</h1>
        <p>Лучшие моменты и кадры</p>
    </header>

    <!-- Основная часть с фото -->
    <div class="container">
        <div class="gallery">
            
            <!-- Фото 1 -->
            <div class="photo-card">
                <!-- Я вставил случайные картинки для примера. Замените ссылки src="" на свои файлы -->
                <img src="3ocMlhQe2W4.jpg" alt="Природа">
                <div class="photo-desc">Красивый пейзаж</div>
            </div>

            <!-- Фото 2 -->
            <div class="photo-card">
                <img src="Святу.png" alt="Собака">
                <div class="photo-desc">Мой питомец</div>
            </div>

            <!-- Фото 3 -->
            <div class="photo-card">
                <img src="2.png" alt="Город">
                <div class="photo-desc">Прогулка по городу</div>
            </div>

             <!-- Фото 4 -->
             <div class="photo-card">
                <img src="Снимок экрана 2025-12-11 033010.png" alt="Кофе">
                <div class="photo-desc">Утренний кофе</div>
            </div>

        </div>
    </div>

    <!-- Нижняя шапка (Подвал) -->
    <footer>
        <h3>Связаться со мной</h3>
        <p>Телефон: +7 (999) 000-00-00 | Telegram: @my_nick</p>
        <p>&copy; 2025 Все права защищены</p>
    </footer>

</body>
</html>
